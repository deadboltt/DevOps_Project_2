name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-lint-and-test:
    name: Python Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check app

      - name: Run Pytest unit suite
        env:
          PYTHONPATH: app
        run: pytest -v app/tests

  helm-and-k8s-validation:
    name: Helm Lint & Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Lint Helm charts
        run: |
          helm lint charts/demo-app
          helm lint charts/task-api --set postgres.password=ci-validation-only

      - name: Validate rendered Kubernetes manifests
        run: |
          mkdir -p /tmp/rendered
          helm template demo-app charts/demo-app > /tmp/rendered/demo-app.yaml
          helm template task-api charts/task-api --set postgres.password=ci-validation-only > /tmp/rendered/task-api.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/rendered/demo-app.yaml /tmp/rendered/task-api.yaml
          kubeconform -strict -ignore-missing-schemas -summary manifests/test-nginx.yaml manifests/test-nginx-ingress.yaml manifests/hpa-test-nginx.yaml gitops/git-server.yaml gitops/gitops-demo-app.yaml

  docker-build-and-lint:
    name: Dockerfile Lint & Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Task API container image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: task-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
