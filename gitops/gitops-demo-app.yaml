apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://git-server.argocd.svc.cluster.local:9418/devops-project-2.git
    targetRevision: HEAD
    path: charts/demo-app
    helm:
      releaseName: gitops-demo
      valuesObject:
        replicaCount: 1
        pageTitle: "DevOps Project 2 - ArgoCD GitOps Demo"
        pageMessage: "Automatically synced and self-healed by ArgoCD."
        ingress:
          enabled: true
          className: nginx
          host: gitops-demo.localtest.me
          path: /
        autoscaling:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
