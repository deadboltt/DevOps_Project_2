api:
  replicaCount: 2
  image:
    repository: task-api
    tag: "1.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 5000
  ingress:
    enabled: true
    className: nginx
    host: task-api.localtest.me
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi

postgres:
  image:
    repository: public.ecr.aws/docker/library/postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  database: tasks
  user: postgres
  password: taskpassword
  storage:
    size: 1Gi
    storageClassName: standard
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

serviceMonitor:
  enabled: true
  interval: 15s
