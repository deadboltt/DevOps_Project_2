{{- if and .Values.prometheusRule.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    release: monitoring
spec:
  groups:
    - name: task-api.rules
      rules:
        - alert: TaskApiHigh5xxErrorRate
          expr: |
            sum(rate(task_api_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(task_api_http_requests_total[5m])), 0.001) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Task API 5xx error rate above 5%"
            description: "More than 5% of requests to {{ .Release.Name }} are returning 5xx over the last 5 minutes."
        - alert: TaskApiHighP95Latency
          expr: |
            histogram_quantile(0.95, sum(rate(task_api_http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Task API p95 latency above 500ms"
            description: "95th percentile request duration for {{ .Release.Name }} exceeded 500ms for 5 minutes."
{{- end }}
