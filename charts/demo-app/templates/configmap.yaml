apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-html
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>{{ .Values.pageTitle }}</title></head>
    <body style="font-family: sans-serif; max-width: 640px; margin: 40px auto;">
      <h1>{{ .Values.pageTitle }}</h1>
      <p>{{ .Values.pageMessage }}</p>
      <p>Release: <strong>{{ .Release.Name }}</strong> | Chart: <strong>{{ .Chart.Name }}-{{ .Chart.Version }}</strong></p>
    </body>
    </html>
